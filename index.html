<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#174C3B" />
    <meta name="description" content="Kenledger — a calm, private notebook for your money." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Kenledger</title>
    <script>
      // Paint in the last-used palette before the app loads (no flash of the default colours).
      try {
        var l = JSON.parse(localStorage.getItem('kenledger:look') || 'null')
        if (l && l.vars) {
          var r = document.documentElement
          l.vars.forEach(function (v) { r.style.setProperty(v[0], v[1]) })
          r.dataset.theme = l.mode; r.style.colorScheme = l.mode
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app-root"></div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
